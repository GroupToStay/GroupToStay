name: Database Reconstruction

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/database-reconstruction.yml"
      - "scripts/run-database-reconstruction.mjs"
      - "scripts/city-localization-provenance.mjs"
      - "scripts/compare-database-evidence.mjs"
      - "supabase/config.toml"
      - "supabase/migration-archive/**"
      - "supabase/migration-candidates/**"
      - "supabase/migrations/**"
      - "supabase/reference-data/cities-arabic.json"
      - "supabase/reference-data/production-country-id-code.json"
      - "supabase/tests/**"
      - "src/integrations/supabase/types.ts"
      - "tests/database-reconstruction.test.ts"
      - "tests/city-localization-provenance.test.ts"
      - "tests/migration-archive.test.ts"
      - "tests/duplicate-trigger-candidate.test.ts"
      - "tests/database-provenance-analysis.test.ts"
      - "tests/database-evidence.test.ts"
      - "docs/database/FUNCTION_SEMANTIC_REVIEW.md"
      - "docs/database/DUPLICATE_TRIGGER_REVIEW.md"
      - "docs/database/JULY_12_MIXED_FINAL_DISPOSITION.md"
      - "docs/database/FOURTH_PASS_POLICY_AND_GRANT_PARITY.md"
      - "docs/database/catalog-fingerprint-comparison.json"
      - "docs/database/*-current.json"
      - "docs/database/FINAL_PRODUCTION_RECONCILIATION_EVIDENCE.md"
  pull_request:
    paths:
      - ".github/workflows/database-reconstruction.yml"
      - "scripts/run-database-reconstruction.mjs"
      - "scripts/city-localization-provenance.mjs"
      - "scripts/compare-database-evidence.mjs"
      - "supabase/config.toml"
      - "supabase/migration-archive/**"
      - "supabase/migration-candidates/**"
      - "supabase/migrations/**"
      - "supabase/reference-data/cities-arabic.json"
      - "supabase/reference-data/production-country-id-code.json"
      - "supabase/tests/**"
      - "src/integrations/supabase/types.ts"
      - "tests/database-reconstruction.test.ts"
      - "tests/city-localization-provenance.test.ts"
      - "tests/migration-archive.test.ts"
      - "tests/duplicate-trigger-candidate.test.ts"
      - "tests/database-provenance-analysis.test.ts"
      - "tests/database-evidence.test.ts"
      - "docs/database/FUNCTION_SEMANTIC_REVIEW.md"
      - "docs/database/DUPLICATE_TRIGGER_REVIEW.md"
      - "docs/database/JULY_12_MIXED_FINAL_DISPOSITION.md"
      - "docs/database/FOURTH_PASS_POLICY_AND_GRANT_PARITY.md"
      - "docs/database/catalog-fingerprint-comparison.json"
      - "docs/database/*-current.json"
      - "docs/database/FINAL_PRODUCTION_RECONCILIATION_EVIDENCE.md"

permissions:
  contents: read

concurrency:
  group: database-reconstruction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconstruct:
    name: Reconstruct Empty Database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_DATABASE_RECONSTRUCTION: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.113.0
          github-token: ${{ github.token }}

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify archive and localization provenance
        run: >-
          pnpm exec vitest run
          tests/migration-archive.test.ts
          tests/duplicate-trigger-candidate.test.ts
          tests/city-localization-provenance.test.ts
          tests/database-provenance-analysis.test.ts
          tests/database-evidence.test.ts
          --reporter=dot

      - name: Reconstruct from an empty isolated database
        run: node scripts/run-database-reconstruction.mjs

      - name: Upload public-safe reconstruction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-reconstruction-${{ github.sha }}
          path: artifacts/database-reconstruction/
          if-no-files-found: error
          retention-days: 14
